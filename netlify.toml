[build]
  command = "npm run build:server && npm run build"
  publish = "out"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 后端接口统一交给 Netlify Function（200 重写，浏览器地址保持 /api/... 不变）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 前端 SPA 回退（静态资源存在时优先返回文件，不触发此规则）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
