services:
  - type: web
    name: chuangyi-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SQLITE_PATH
        value: /var/lib/data/data.sqlite
    disk:
      name: data
      mountPath: /var/lib/data
      sizeGB: 1
